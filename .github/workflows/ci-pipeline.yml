name: QA Automation Regression Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 
jobs:
  automation-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
        cache: 'maven'

    - name: Ejecutar Pruebas de UI (Selenium en modo Headless)
      id: run-tests
      run: |
        mvn -f automation-frameworks/java-testng-selenium/pom.xml clean test -Dheadless=true

    - name: Guardar Reportes como Artefactos
      if: always() # Obliga a ejecutar este paso aunque el paso anterior falle
      uses: actions/upload-artifact@v4
      with:
        name: testng-execution-reports
        path: |
          automation-frameworks/java-testng-selenium/target/surefire-reports/
        if-no-files-found: warn # Evita que el pipeline se caiga si no encuentra la carpeta
